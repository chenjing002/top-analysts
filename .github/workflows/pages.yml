name: Deploy discussion archive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render rounds, rebuild index, validate
        run: |
          python3 scripts/render_round.py --all
          python3 scripts/build_index.py
          python3 scripts/validate.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r sessions _site/sessions
          cp -r experts _site/experts
          cp -r knowledge _site/knowledge
          cp -r Thinkers _site/Thinkers
          cp -r observer _site/observer
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
